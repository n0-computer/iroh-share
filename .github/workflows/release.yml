name: Binary releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: cargo build
            packages: --workspace
          - os: macos-15
            target: aarch64-apple-darwin
            build: cargo build
            packages: --workspace
          # Static daemon, CLI and TUI binaries that run on any Linux, including
          # NAS systems with an old glibc. Built with zig, which also
          # cross-compiles aarch64 on an x86_64 runner.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            build: cargo zigbuild
            packages: -p iroh-share -p iroh-share-tui
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            build: cargo zigbuild
            packages: -p iroh-share -p iroh-share-tui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig
        if: matrix.build == 'cargo zigbuild'
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: Build binaries
        run: ${{ matrix.build }} --release --locked ${{ matrix.packages }} --target ${{ matrix.target }}
      - name: Check that the Linux binaries are static and run
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          for binary in iroh-share iroh-share-background iroh-share-tui; do
            path=target/${{ matrix.target }}/release/$binary
            file "$path" | grep -qE 'statically linked|static-pie linked' || { file "$path"; exit 1; }
            "$path" --help > /dev/null
          done
      - name: Package binaries and checksums
        run: python .github/scripts/package.py ${{ matrix.target }}
      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Test Windows install, upgrade, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/smoke.ps1
      - name: Build per-user macOS installer
        if: runner.os == 'macOS'
        run: python packaging/macos/build.py
      - name: Test macOS install, upgrade, and uninstall
        if: runner.os == 'macOS'
        run: python packaging/macos/smoke.py
      - name: Upload installer test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-logs-${{ matrix.target }}
          path: installer-test-logs/*
      - uses: actions/upload-artifact@v4
        with:
          name: iroh-share-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
