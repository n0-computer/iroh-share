name: Binary releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: cargo build
            packages: --workspace
          - os: macos-15
            target: aarch64-apple-darwin
            build: cargo build
            packages: --workspace
          # Static daemon, CLI and TUI binaries that run on any Linux, including
          # NAS systems with an old glibc. Built with zig, which also
          # cross-compiles aarch64 on an x86_64 runner.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            build: cargo zigbuild
            packages: -p iroh-share -p iroh-share-tui
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            build: cargo zigbuild
            packages: -p iroh-share -p iroh-share-tui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache here on purpose: this job produces the binaries and
      # installers users download, and a cache entry is an input to that
      # build. Tag builds are rare enough to pay the from-scratch cost.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zig
        if: matrix.build == 'cargo zigbuild'
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: Build binaries
        run: ${{ matrix.build }} --release --locked ${{ matrix.packages }} --target ${{ matrix.target }}
      - name: Check that the Linux binaries are static and run
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          for binary in iroh-share iroh-share-background iroh-share-tui; do
            path=target/${{ matrix.target }}/release/$binary
            file "$path" | grep -qE 'statically linked|static-pie linked' || { file "$path"; exit 1; }
            "$path" --help > /dev/null
          done
      - name: Package binaries and checksums
        run: python .github/scripts/package.py ${{ matrix.target }}
      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Test Windows install, upgrade, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/smoke.ps1
      - name: Build per-user macOS installer
        if: runner.os == 'macOS'
        run: python packaging/macos/build.py
      - name: Test macOS install, upgrade, and uninstall
        if: runner.os == 'macOS'
        run: python packaging/macos/smoke.py
      - name: Upload installer test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-test-logs-${{ matrix.target }}
          path: installer-test-logs/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroh-share-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # DSM 6 and DSM 7 packages from the static x86_64 and aarch64 Linux builds.
  synology:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: iroh-share-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - name: Test the package builder
        run: python -m unittest discover -s packaging/synology
      - name: Build Synology packages
        run: python packaging/synology/build.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroh-share-synology
          path: dist/*.spk*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, synology]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/release.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Versioned archive names, one SHA256SUMS, and download links first.
          python3 .github/scripts/release.py dist "$GH_REPO" "$RELEASE_TAG" > notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --notes-file notes.md --generate-notes --title "$RELEASE_TAG"
          fi
