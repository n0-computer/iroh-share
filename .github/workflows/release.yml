name: Binary releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Build all binaries
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package binaries and checksums
        run: python .github/scripts/package.py ${{ matrix.target }}
      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Test Windows install, upgrade, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/smoke.ps1
      - name: Build per-user macOS installer
        if: runner.os == 'macOS'
        run: python packaging/macos/build.py
      - name: Test macOS install, upgrade, and uninstall
        if: runner.os == 'macOS'
        run: python packaging/macos/smoke.py
      - name: Install nfpm
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
        run: |
          arch=$(uname -m); [ "$arch" = aarch64 ] && arch=arm64
          base="https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION"
          curl -fsSLO "$base/nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz"
          curl -fsSL "$base/checksums.txt" | grep " nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz\$" | sha256sum -c -
          sudo tar -xzf "nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz" -C /usr/local/bin nfpm
          rm "nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz"
      - name: Build deb, rpm and Arch Linux packages
        if: runner.os == 'Linux'
        run: python packaging/linux/build-packages.py ${{ matrix.target }}
      - name: Test Linux install, upgrade, and uninstall
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          python packaging/linux/smoke.py
      - name: Test deb, rpm and Arch Linux packages
        if: runner.os == 'Linux'
        run: python packaging/linux/smoke-packages.py
      - name: Upload installer test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-logs-${{ matrix.target }}
          path: installer-test-logs/*
      - uses: actions/upload-artifact@v4
        with:
          name: blobtorrent-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
