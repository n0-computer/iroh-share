<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- White halo so the black shapes still read on dark backgrounds. -->
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="grown" operator="in" result="ring"/>
      <feMerge><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#halo)" transform="translate(9 0)">
    <!-- Waving arm with the iroh link glove. -->
    <path d="M35 62 C24 58 20 50 22 41" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <g stroke-linecap="round" fill="none">
      <g stroke="#000" stroke-width="8.5">
        <path d="M22 39 L16 30"/><path d="M22 39 L21 27"/><path d="M22 39 L26 28"/><path d="M22 39 L30 34"/>
      </g>
      <g stroke="#fff" stroke-width="4">
        <path d="M22 39 L16 30"/><path d="M22 39 L21 27"/><path d="M22 39 L26 28"/><path d="M22 39 L30 34"/>
        <circle cx="22" cy="39" r="2.5" fill="#fff"/>
      </g>
    </g>
    <!-- The server: the mascot itself. -->
    <rect x="35" y="24" width="58" height="82" rx="10" fill="#fff" stroke="#000" stroke-width="7"/>
    <path d="M35 70 H93 M35 88 H93" stroke="#000" stroke-width="5"/>
    <!-- Face on the top unit, same style as iroh link. -->
    <ellipse cx="55" cy="44" rx="4.5" ry="7" fill="#000"/>
    <ellipse cx="72" cy="44" rx="4.5" ry="7" fill="#000"/>
    <ellipse cx="56.5" cy="41.5" rx="1.5" ry="2.1" fill="#fff"/>
    <ellipse cx="73.5" cy="41.5" rx="1.5" ry="2.1" fill="#fff"/>
    <path d="M53 57 Q63 63 74 56" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Rack units: a slot and a status light each. -->
    <path d="M45 79 H66 M45 97 H66" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="81" cy="79" r="3" fill="#000"/>
    <circle cx="81" cy="97" r="3" fill="#000"/>
  </g>
  <ellipse cx="68" cy="118" rx="32" ry="3" fill="#000" opacity=".12"/>
</svg>
