[workspace]
members = ["blobtorrent", "blobtorrent-proto", "blobtorrent-tui"]
default-members = ["blobtorrent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
url = { version = "2", features = ["serde"] }
serde_json = "1"
simple-dns = "0.12"
z32 = "1.3"
blobtorrent-proto = { path = "blobtorrent-proto" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
irpc-iroh = "0.17"
irpc = { version = "0.17", features = ["rpc"] }
rand = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
iroh = "1"
iroh-blobs = "0.103"
n0-future = "0.3"
walkdir = "2"
blake3 = "1"
iroh-mainline-endpoint-discovery = { git = "https://github.com/n0-computer/iroh-content-discovery.git", rev = "9c9973c1a481a37e468633a360df29e5f52c6bab" }
n0-mainline = { version = "0.6", git = "https://github.com/n0-computer/n0-mainline.git", branch = "addr-index-datagrams" }

tempfile = "3"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
