[workspace]
members = ["iroh-share", "iroh-share-proto", "iroh-share-tui", "iroh-share-gui"]
default-members = ["iroh-share"]
resolver = "2"

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Rüdiger Klaehn <rklaehn@protonmail.com>", "n0 team"]
repository = "https://github.com/n0-computer/iroh-share"

[workspace.dependencies]
url = { version = "2", features = ["serde"] }
serde_json = "1"
simple-dns = "0.12"
z32 = "1.3"
iroh-share-proto = { path = "iroh-share-proto" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
irpc-iroh = "0.17"
irpc = { version = "0.17", features = ["rpc"] }
rand = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
iroh = "1"
iroh-blobs = "0.103"
n0-future = "0.3"
walkdir = "2"
blake3 = "1"
iroh-mainline-endpoint-discovery = { git = "https://github.com/n0-computer/iroh-content-discovery.git", rev = "e9df2cccddc4370d8e39adb4efe275e8bb4913f6" }
n0-mainline = "0.7.1"

tempfile = "3"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }

[patch.crates-io]
# Until the next iroh-blobs release: logs why requests failed and why the
# metadata db actor stopped (n0-computer/iroh-blobs#268).
iroh-blobs = { git = "https://github.com/n0-computer/iroh-blobs", rev = "425ee37ec7bc2749acedfe3436a6dc46db32c256" }
